<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mori — Swipe. Order. Cook.</title>
<meta name="description" content="The recipe app that learns your taste. Swipe through personalised recipes, build a smart grocery list, and order ingredients in one tap.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mori">
<meta name="theme-color" content="#2E7D32">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
button, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  html { scroll-behavior: auto; }
}

:root {
  --green:       #2E7D32;
  --green-mid:   #4CAF50;
  --green-light: #E8F5E9;
  --green-pale:  #F2FAF2;
  --text:        #1A1A1A;
  --text-mid:    #444444;
  --text-muted:  #888888;
  --border:      #E0E0E0;
  --bg:          #FFFFFF;
  --bg-soft:     #FAFAF8;
  --linen:       #F8F3EC;
  --moss:        #2E5438;
  /* Instacart brand */
  --ic-orange:   #FF7009;
  --ic-orange-dark: #E55A00;
  --ic-cream:    #FFF4E6;
  /* Accent + warm earth tones for backgrounds */
  --warm-blush:  #F4ECE0;
  --sage-light:  #DDE8DC;
  --paper:       #FBF7F1;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}
/* App icon */
.app-icon {
  width: 72px; height: 72px;
  border-radius: 18px;
  background: #F8F3EC;
  border: 1px solid #E0D4C4;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(46,84,56,0.10);
  flex-shrink: 0;
  overflow: hidden;
}
.app-icon-sm { width: 52px; height: 52px; border-radius: 13px; }
.launch-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: #fff; border: 1px solid #E0E0E0;
  border-radius: 999px; padding: 6px 14px 6px 8px;
  font-size: 0.8rem; color: #444; margin-bottom: 1.5rem;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

/* ── NAV ── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 1rem 2.5rem;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.nav-logo {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 1.5rem;
  font-weight: 400;
  color: var(--green);
  letter-spacing: -0.03em;
  position: relative;
  display: flex; align-items: center;
}
.nav-right { display: flex; align-items: center; gap: 1.5rem; }
.nav-link { font-size: 0.875rem; color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
.nav-link:hover { color: var(--text); }
.btn-primary {
  background: var(--green); color: #fff;
  border: none; padding: 0.75rem 1.4rem;
  border-radius: 999px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.875rem; font-weight: 500;
  cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; min-height: 44px; /* Apple HIG minimum */
  transition: all 0.2s;
}
.btn-primary:hover { background: #236227; transform: translateY(-1px); }
.btn-outline {
  background: transparent; color: var(--green);
  border: 1.5px solid var(--green);
  padding: 0.7rem 1.3rem; border-radius: 999px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.875rem; font-weight: 500;
  cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; min-height: 44px;
  transition: all 0.2s;
}
.btn-outline:hover { background: var(--green-pale); }

/* ── HERO ── */
.hero-wrap {
  position: relative;
  background: linear-gradient(160deg, #F9FBF9 0%, #FFFFFF 50%, #FBF8F4 100%);
  overflow: hidden;
}
.hero-wrap::before {
  content: ''; position: absolute; pointer-events: none;
  width: 600px; height: 600px; border-radius: 50%;
  background: radial-gradient(circle, rgba(46,125,50,0.08) 0%, transparent 70%);
  top: -200px; right: -150px; filter: blur(20px);
}
.hero-wrap::after {
  content: ''; position: absolute; pointer-events: none;
  width: 500px; height: 500px; border-radius: 50%;
  background: radial-gradient(circle, rgba(248,243,236,0.9) 0%, transparent 70%);
  bottom: -100px; left: -200px; filter: blur(30px);
}
.hero {
  position: relative; z-index: 1;
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  align-items: center;
  gap: 3rem;
  padding: 8rem 4rem 4rem;
  max-width: 1320px; margin: 0 auto;
}
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--green-light); color: var(--green);
  font-size: 0.75rem; font-weight: 500; letter-spacing: 0.12em;
  text-transform: uppercase; padding: 6px 14px;
  border-radius: 999px; margin-bottom: 1.5rem;
  opacity: 0; animation: fadeUp 0.6s 0.1s forwards;
}
.eyebrow-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--green);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.7)} }

.hero-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.8rem, 5vw, 5rem);
  font-weight: 700; line-height: 1.08;
  letter-spacing: -0.02em; color: var(--text);
  margin-bottom: 1rem;
  opacity: 0; animation: fadeUp 0.6s 0.25s forwards;
}
.hero-title em { font-style: italic; color: var(--green); }

.hero-tagline {
  font-size: 0.8rem; font-weight: 400;
  color: var(--text-muted); letter-spacing: 0.25em;
  text-transform: uppercase; margin-bottom: 0.5rem;
  opacity: 0; animation: fadeUp 0.6s 0.38s forwards;
}
.hero-brand-line {
  font-family: 'Playfair Display', serif;
  font-style: italic; font-size: 1.1rem;
  color: var(--moss); margin-bottom: 1.5rem;
  opacity: 0; animation: fadeUp 0.6s 0.45s forwards;
}

.hero-sub {
  font-size: 1.05rem; font-weight: 300; line-height: 1.75;
  color: var(--text-mid); max-width: 460px;
  margin-bottom: 2.5rem;
  opacity: 0; animation: fadeUp 0.6s 0.5s forwards;
}

.hero-form {
  display: flex; gap: 8px; max-width: 400px;
  opacity: 0; animation: fadeUp 0.6s 0.65s forwards;
}
.hero-input {
  flex: 1; background: var(--bg-soft);
  border: 1.5px solid var(--border);
  border-radius: 999px; padding: 0.75rem 1.2rem;
  font-family: 'DM Sans', sans-serif; font-size: 1rem; /* 16px min — prevents iOS auto-zoom */
  color: var(--text); outline: none; transition: border-color 0.2s;
  -webkit-appearance: none;
}
.hero-input::placeholder { color: var(--text-muted); }
.hero-input:focus { border-color: var(--green); }
.hero-note { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.75rem; }

/* ── PHONE STACK ── */
.hero-right {
  position: relative; display: flex; justify-content: center;
  opacity: 0; animation: fadeUp 0.8s 0.3s forwards;
}
.phone-stack { position: relative; width: 300px; height: 560px; }
.phone-back {
  position: absolute; left: -52px; top: 28px; width: 256px;
  border-radius: 38px; overflow: hidden;
  border: 2px solid #E0E0E0;
  transform: rotate(-5deg);
  box-shadow: -8px 16px 40px rgba(0,0,0,0.10);
  opacity: 0.75;
}
.phone-back img { width: 100%; display: block; }
.phone-front {
  position: absolute; right: -12px; top: 0; width: 272px;
  border-radius: 38px; overflow: hidden;
  border: 2px solid #E0E0E0;
  box-shadow: 16px 16px 60px rgba(0,0,0,0.13), 0 0 0 1px rgba(46,125,50,0.08);
}
.phone-front img { width: 100%; display: block; }

/* ── STATS BAR ── */
.stats-bar {
  background: var(--green-pale);
  border-top: 1px solid var(--green-light);
  border-bottom: 1px solid var(--green-light);
  padding: 1.5rem 2rem;
}
.stats-inner {
  max-width: 900px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(3,1fr);
  gap: 1rem; text-align: center;
}
.stat-num {
  font-family: 'Playfair Display', serif;
  font-size: 2rem; font-weight: 700; color: var(--green);
  line-height: 1;
}
.stat-label { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }

/* ── FEATURES ── */
.features-wrap {
  position: relative;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(232,245,233,0.4) 0%, transparent 60%),
    var(--bg);
  overflow: hidden;
}
.features-wrap::before {
  content: ''; position: absolute; pointer-events: none;
  width: 320px; height: 320px; border-radius: 50%;
  background: radial-gradient(circle, rgba(248,243,236,0.7) 0%, transparent 70%);
  top: 30%; right: -100px; filter: blur(20px);
}
.features {
  position: relative; z-index: 1;
  padding: 6rem 2rem;
  max-width: 1240px; margin: 0 auto;
}
.section-eyebrow {
  display: inline-block; font-size: 0.72rem; font-weight: 500;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--green); margin-bottom: 0.75rem;
}
.section-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2rem, 4vw, 2.8rem);
  font-weight: 700; line-height: 1.15;
  margin-bottom: 0.75rem; color: var(--text);
}
.section-title em { font-style: italic; color: var(--green); }
.section-sub {
  font-size: 1rem; font-weight: 300; color: var(--text-mid);
  max-width: 520px; line-height: 1.7; margin-bottom: 3.5rem;
}

.features-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 1.5rem; }
.feature-card {
  position: relative;
  background: rgba(255,255,255,0.7);
  border: 1px solid var(--border);
  border-radius: 22px; padding: 2rem;
  transition: all 0.35s cubic-bezier(.2,.8,.2,1);
  backdrop-filter: blur(6px);
  overflow: hidden;
}
.feature-card::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(46,125,50,0.04) 0%, transparent 60%);
  opacity: 0; transition: opacity 0.35s;
  pointer-events: none;
}
.feature-card:hover {
  border-color: rgba(46,125,50,0.25);
  background: #fff;
  transform: translateY(-6px);
  box-shadow: 0 16px 40px rgba(46,125,50,0.12), 0 4px 12px rgba(0,0,0,0.05);
}
.feature-card:hover::before { opacity: 1; }
.feature-card:nth-child(2):hover { box-shadow: 0 16px 40px rgba(255,112,9,0.12), 0 4px 12px rgba(0,0,0,0.05); border-color: rgba(255,112,9,0.25); }
.feature-card:nth-child(2):hover::before { background: linear-gradient(135deg, rgba(255,112,9,0.06) 0%, transparent 60%); }
.feature-icon {
  width: 48px; height: 48px; border-radius: 14px;
  background: linear-gradient(135deg, var(--green-light) 0%, rgba(232,245,233,0.5) 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.15rem; color: var(--green);
  margin-bottom: 1.2rem; font-weight: 700;
  box-shadow: 0 4px 12px rgba(46,125,50,0.08);
}
.feature-title { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text); font-family: 'DM Sans', sans-serif; }
.feature-desc { font-size: 0.9rem; font-weight: 400; color: var(--text-mid); line-height: 1.65; }

/* ── SHOWCASE ── */
.showcase {
  position: relative;
  background:
    radial-gradient(ellipse 50% 70% at 0% 50%, rgba(46,84,56,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 50% 70% at 100% 50%, rgba(255,112,9,0.05) 0%, transparent 60%),
    var(--paper);
  border-top: 1px solid rgba(46,84,56,0.08);
  border-bottom: 1px solid rgba(46,84,56,0.08);
  padding: 6rem 2rem; overflow: hidden;
}
.showcase::before {
  content: ''; position: absolute; pointer-events: none;
  width: 100%; height: 1px; top: 0; left: 0;
  background: linear-gradient(90deg, transparent, rgba(46,125,50,0.2), transparent);
}
.showcase-inner { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; }
.screens-showcase {
  display: flex; gap: 1.75rem;
  justify-content: center; align-items: flex-start;
  padding: 1rem 2rem 1.5rem;
}
.screen-phone-wrap { text-align: center; flex-shrink: 0; }
.screen-phone {
  width: 220px; border-radius: 30px; overflow: hidden;
  border: 1.5px solid rgba(0,0,0,0.07);
  box-shadow: 0 24px 60px rgba(0,0,0,0.13), 0 6px 16px rgba(0,0,0,0.06);
  cursor: zoom-in;
  background: #000;
  transition: transform 0.4s cubic-bezier(.2,.8,.2,1), box-shadow 0.4s ease;
}
.screen-phone:hover {
  transform: translateY(-10px);
  box-shadow: 0 30px 72px rgba(0,0,0,0.16), 0 8px 24px rgba(0,0,0,0.07);
}
.screen-phone img { width: 100%; display: block; }
.screen-phone-label { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.65rem; }
/* staggered heights */
.screen-phone-wrap:nth-child(1) .screen-phone { margin-top: 56px; }
.screen-phone-wrap:nth-child(2) .screen-phone { margin-top: 16px; }
.screen-phone-wrap:nth-child(3) .screen-phone { margin-top: 0; }
.screen-phone-wrap:nth-child(4) .screen-phone { margin-top: 40px; }
.screen-phone-wrap:nth-child(5) .screen-phone { margin-top: 20px; }
.screen-phone-wrap:nth-child(6) .screen-phone { margin-top: 36px; }
@media (max-width: 900px) {
  .screens-showcase { overflow-x: auto; justify-content: flex-start; padding-left: 1rem; }
  .screen-phone { width: 155px; }
}
/* Lightbox */
#lightbox {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.88); z-index: 9999;
  align-items: center; justify-content: center;
  cursor: zoom-out;
}
#lightbox.open { display: flex; }
#lightbox img {
  max-height: 90vh; max-width: min(420px, 90vw);
  border-radius: 28px;
  box-shadow: 0 32px 80px rgba(0,0,0,0.6);
  animation: fadeUp 0.2s ease forwards;
}
.screen-item {
  flex-shrink: 0; width: 200px;
  border-radius: 28px; overflow: hidden;
  border: 1.5px solid var(--border);
  box-shadow: 0 12px 32px rgba(0,0,0,0.08);
  transition: transform 0.3s;
}
.screen-item:hover { transform: translateY(-6px) scale(1.02); }
.screen-item img { width: 100%; display: block; }
.screen-item.offset-up { margin-top: -24px; }
.screen-item.offset-down { margin-top: 24px; }
.screen-caption {
  text-align: center; margin-top: 0.6rem;
  font-size: 0.72rem; color: var(--text-muted);
}

/* ── HOW IT WORKS ── */
.how { padding: 5rem 2rem; max-width: 900px; margin: 0 auto; }
.steps { display: grid; grid-template-columns: repeat(3,1fr); gap: 2rem; margin-top: 3rem; }
.step { text-align: center; padding: 1.5rem 1rem; }
.step-num {
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--green-light); border: 1.5px solid var(--green);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem; font-weight: 700; color: var(--green);
  margin: 0 auto 1.25rem;
}
.step-title { font-size: 1rem; font-weight: 500; margin-bottom: 0.4rem; color: var(--text); }
.step-desc { font-size: 0.855rem; font-weight: 300; color: var(--text-mid); line-height: 1.65; }

/* ── TASTE PROFILE HIGHLIGHT ── */
.profile-section {
  position: relative;
  background:
    radial-gradient(ellipse 60% 50% at 80% 0%, rgba(46,84,56,0.10) 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 0% 100%, rgba(232,221,208,0.6) 0%, transparent 60%),
    var(--linen);
  border-top: 1px solid #E8DDD0;
  border-bottom: 1px solid #E8DDD0;
  padding: 7rem 2rem;
  overflow: hidden;
}
.profile-section::before {
  content: ''; position: absolute; pointer-events: none;
  width: 700px; height: 700px; border-radius: 50%;
  background: radial-gradient(circle, rgba(46,84,56,0.08) 0%, transparent 70%);
  top: -250px; left: -250px; filter: blur(40px);
  z-index: 0;
}
.profile-inner {
  position: relative; z-index: 1;
  max-width: 1240px; margin: 0 auto;
  display: grid; grid-template-columns: 1.05fr 1fr;
  gap: 5rem; align-items: center;
}
.profile-quote {
  background: #fff;
  border: 1px solid #E8DDD0;
  border-radius: 18px; padding: 2rem;
  font-family: 'Playfair Display', serif;
  font-style: italic; font-size: 1.05rem;
  color: var(--moss); line-height: 1.7;
  position: relative;
}
.profile-quote-mark {
  font-size: 4rem; color: #E0EDD8; line-height: 0;
  position: absolute; top: 24px; left: 20px;
  font-family: Georgia, serif;
}
.profile-text { padding-top: 1rem; }
.profile-text .section-sub { margin-bottom: 2rem; }

/* Flavour DNA bars */
.dna-list { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem; }
.dna-row {
  display: grid;
  grid-template-columns: 90px 1fr;
  grid-template-rows: auto auto;
  column-gap: 14px; row-gap: 4px;
  align-items: center;
}
.dna-label {
  font-family: 'Playfair Display', serif;
  font-style: italic; font-weight: 700;
  font-size: 0.95rem; color: var(--moss);
  grid-row: 1 / 2;
}
.dna-bar {
  position: relative; height: 6px; border-radius: 999px;
  background: rgba(46,84,56,0.10);
  grid-row: 1 / 2; overflow: hidden;
}
.dna-bar > span {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: linear-gradient(90deg, var(--green) 0%, var(--green-mid) 100%);
  border-radius: 999px;
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 1.2s cubic-bezier(.2,.8,.2,1);
}
.dna-list.dna-active .dna-bar > span { transform: scaleX(1); }
.dna-list .dna-row:nth-child(1) .dna-bar > span { transition-delay: 0.05s; }
.dna-list .dna-row:nth-child(2) .dna-bar > span { transition-delay: 0.18s; }
.dna-list .dna-row:nth-child(3) .dna-bar > span { transition-delay: 0.32s; }
.dna-list .dna-row:nth-child(4) .dna-bar > span { transition-delay: 0.46s; }
.dna-meta {
  grid-column: 2 / 3; grid-row: 2 / 3;
  font-size: 0.78rem; color: var(--text-mid);
  letter-spacing: 0.02em;
}
.dna-meta em { font-family: 'Playfair Display', serif; font-style: italic; color: var(--text-muted); font-weight: 400; }

/* Two-phone stack for taste profile */
.profile-phones {
  position: relative;
  display: flex; justify-content: center; align-items: flex-start;
  min-height: 660px;
  padding: 1rem;
}
.profile-phones::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, rgba(46,84,56,0.06) 0%, transparent 60%);
  z-index: 0;
}
.profile-phone {
  border-radius: 38px; overflow: hidden;
  border: 1.5px solid rgba(0,0,0,0.07);
  background: #000;
}
.profile-phone img { width: 100%; display: block; }
.profile-phone-back {
  position: absolute; left: 0; top: 60px;
  width: 240px;
  transform: rotate(-7deg);
  box-shadow: -16px 24px 60px rgba(46,84,56,0.22);
  opacity: 0.92;
  z-index: 1;
}
.profile-phone-front {
  position: relative;
  width: 280px;
  margin-left: 70px;
  box-shadow:
    24px 28px 80px rgba(46,84,56,0.28),
    0 10px 24px rgba(0,0,0,0.10);
  z-index: 2;
  transform: rotate(2deg);
}
.profile-chip {
  position: absolute; bottom: 20px; right: 10px; z-index: 3;
  display: flex; align-items: center; gap: 14px;
  background: #fff;
  border: 1px solid #E8DDD0;
  border-radius: 18px; padding: 14px 20px 14px 14px;
  box-shadow: 0 18px 40px rgba(46,84,56,0.18), 0 4px 12px rgba(0,0,0,0.06);
  max-width: 260px;
}
.profile-chip-icon {
  width: 44px; height: 44px; border-radius: 12px;
  background: linear-gradient(135deg, var(--green-light) 0%, rgba(232,245,233,0.5) 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem;
  box-shadow: 0 4px 12px rgba(46,125,50,0.10);
}
.profile-chip-title { font-size: 0.95rem; font-weight: 700; color: var(--moss); font-family: 'Playfair Display',serif; font-style: italic; }
.profile-chip-sub { font-size: 0.72rem; color: var(--text-muted); font-family: 'DM Sans',sans-serif; margin-top: 3px; }

/* ── DUO SECTION (Plan + Grocery) ── */
.duo-section {
  position: relative;
  background:
    radial-gradient(ellipse 70% 50% at 85% 20%, rgba(255,112,9,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 15% 80%, rgba(46,125,50,0.07) 0%, transparent 60%),
    var(--paper);
  padding: 7rem 2rem;
  overflow: hidden;
}
/* Decorative blob shapes */
.duo-section::before,
.duo-section::after {
  content: ''; position: absolute; pointer-events: none;
  border-radius: 50%;
  filter: blur(40px); opacity: 0.45;
  z-index: 0;
}
.duo-section::before {
  width: 380px; height: 380px;
  background: radial-gradient(circle, var(--green-light) 0%, transparent 70%);
  top: -80px; right: -120px;
}
.duo-section::after {
  width: 480px; height: 480px;
  background: radial-gradient(circle, var(--ic-cream) 0%, transparent 70%);
  bottom: -160px; left: -160px;
}
.duo-inner {
  position: relative; z-index: 1;
  max-width: 1240px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 7rem;
}
.duo-tile {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4rem; align-items: center;
  position: relative;
}
.duo-tile-reverse { direction: rtl; }
.duo-tile-reverse > * { direction: ltr; }
.duo-text { padding: 1rem 0; max-width: 520px; }
.duo-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2rem, 3.6vw, 2.9rem);
  font-weight: 700; line-height: 1.12;
  color: var(--text);
  margin-bottom: 1.25rem;
}
.duo-title em { font-style: italic; color: var(--green); }
.duo-desc {
  font-size: 1.08rem; font-weight: 300; line-height: 1.7;
  color: var(--text-mid); margin-bottom: 2rem;
  max-width: 480px;
}
.duo-list {
  list-style: none; padding: 0; margin: 0;
  display: flex; flex-direction: column; gap: 0.75rem;
}
.duo-list li {
  display: flex; gap: 12px; align-items: flex-start;
  font-size: 0.98rem; color: var(--text-mid);
  font-family: 'DM Sans', sans-serif;
  line-height: 1.55;
}
.duo-list li::before {
  content: ''; flex-shrink: 0;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--green);
  margin-top: 9px;
  box-shadow: 0 0 0 4px rgba(46,125,50,0.10);
}
.duo-list li span { display: none; }

/* Backdrop card behind the phone — fills empty space */
.duo-phone-wrap {
  position: relative;
  display: flex; justify-content: center; align-items: center;
  min-height: 640px;
  padding: 2.5rem;
  will-change: transform;
}
.duo-phone-wrap::before {
  content: '';
  position: absolute; inset: 1.5rem;
  border-radius: 36px;
  background:
    linear-gradient(135deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.2) 100%);
  border: 1px solid rgba(46,84,56,0.08);
  backdrop-filter: blur(8px);
  z-index: 0;
}
/* Variant: Instacart-tinted backdrop on the grocery tile */
.duo-tile-grocery .duo-phone-wrap::before {
  background:
    linear-gradient(135deg, rgba(255,112,9,0.08) 0%, rgba(255,244,230,0.5) 100%);
  border: 1px solid rgba(255,112,9,0.15);
}
.duo-phone {
  position: relative; z-index: 1;
  width: 300px; border-radius: 40px; overflow: hidden;
  border: 1.5px solid rgba(0,0,0,0.07);
  background: #000;
  box-shadow:
    0 40px 90px rgba(0,0,0,0.22),
    0 12px 28px rgba(0,0,0,0.10),
    0 0 0 1px rgba(255,255,255,0.06) inset;
}
.duo-phone img { width: 100%; display: block; }

/* ── BIG floating chips ── */
.duo-floater {
  position: absolute;
  background: #fff;
  border: 1px solid rgba(0,0,0,0.06);
  border-radius: 20px;
  padding: 18px 22px;
  box-shadow:
    0 24px 56px rgba(0,0,0,0.14),
    0 6px 14px rgba(0,0,0,0.06);
  font-family: 'DM Sans', sans-serif;
  z-index: 4;
  display: flex; align-items: center; gap: 14px;
  min-width: 180px;
  will-change: transform;
}
.duo-floater-tl { top: 8%; left: -6%; }
.duo-floater-br { bottom: 6%; right: -6%; }
.duo-floater-icon {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--green-light);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.duo-floater-icon svg { width: 22px; height: 22px; color: var(--green); }
.duo-floater-num {
  font-family: 'Playfair Display', serif;
  font-size: 1.5rem; font-weight: 700; color: var(--text);
  line-height: 1;
}
.duo-floater-num em { font-style: italic; color: var(--green); font-weight: 700; }
.duo-floater-lbl {
  font-size: 0.78rem; color: var(--text-muted);
  margin-top: 6px; letter-spacing: 0.02em;
  font-weight: 400;
}

/* Instacart-branded floater (the orange one) */
.duo-floater-ic {
  background: linear-gradient(135deg, #FF7009 0%, #E55A00 100%);
  border: none;
  color: #fff;
  box-shadow:
    0 24px 56px rgba(255,112,9,0.32),
    0 6px 14px rgba(255,112,9,0.18);
}
.duo-floater-ic .duo-floater-icon {
  background: #fff; /* white circle so the carrot pops */
}
.duo-floater-ic .duo-floater-icon svg { color: #FF7009; }
.duo-floater-ic .duo-floater-num { color: #fff; font-weight: 700; }
.duo-floater-ic .duo-floater-lbl { color: rgba(255,255,255,0.9); font-weight: 500; }

/* Instacart carrot image inside the orange chip */
.duo-floater-icon-img {
  background: #fff;
  padding: 6px;
}
.duo-floater-icon-img img {
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
}

/* Dark "staples skipped" variant */
.duo-floater-dark {
  background: #0F1F12;
  border: 1px solid #1F3322;
  color: #E8F5E9;
}
.duo-floater-dark .duo-floater-icon { background: rgba(165,214,167,0.15); }
.duo-floater-dark .duo-floater-icon svg { color: #A5D6A7; }
.duo-floater-dark .duo-floater-num { color: #fff; }
.duo-floater-dark .duo-floater-num em { color: #A5D6A7; }
.duo-floater-dark .duo-floater-lbl { color: #9DB39E; }

/* Small Instacart partnership badge under grocery title */
.ic-partner-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--ic-cream);
  border: 1px solid rgba(255,112,9,0.25);
  color: var(--ic-orange-dark);
  padding: 6px 12px 6px 8px;
  border-radius: 999px;
  font-size: 0.75rem; font-weight: 600;
  font-family: 'DM Sans', sans-serif;
  letter-spacing: 0.02em;
  margin-bottom: 1rem;
}
.ic-partner-badge .ic-mark {
  width: 18px; height: 18px;
  display: block;
  object-fit: contain;
}

@media (max-width: 900px) {
  .duo-section { padding: 5rem 1.5rem; }
  .duo-inner { gap: 5rem; }
  .duo-tile, .duo-tile-reverse { grid-template-columns: 1fr; gap: 2.5rem; direction: ltr; }
  .duo-text { text-align: center; margin: 0 auto; }
  .duo-desc { margin-left: auto; margin-right: auto; }
  .duo-list { display: inline-flex; text-align: left; margin: 0 auto; }
  .duo-phone-wrap { min-height: 560px; }
  .duo-floater-tl { left: -4%; top: 4%; }
  .duo-floater-br { right: -4%; bottom: 4%; }
}
@media (max-width: 560px) {
  .duo-phone { width: 240px; }
  .duo-phone-wrap { min-height: 500px; padding: 1.5rem; }
  .duo-floater { padding: 12px 16px; min-width: 150px; }
  .duo-floater-icon { width: 36px; height: 36px; }
  .duo-floater-num { font-size: 1.15rem; }
  .duo-floater-lbl { font-size: 0.7rem; }
}

/* ── CTA ── */
.cta-section {
  padding: 6rem 2rem; text-align: center;
  background: var(--green);
}
.cta-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2rem, 4.5vw, 3.5rem);
  font-weight: 700; color: #fff; line-height: 1.1;
  margin-bottom: 1rem;
}
.cta-title em { font-style: italic; color: #A5D6A7; }
.cta-sub { font-size: 1rem; color: rgba(255,255,255,0.75); margin-bottom: 2.5rem; font-weight: 300; }
.cta-form { display: flex; gap: 8px; max-width: 400px; margin: 0 auto; }
.cta-input {
  flex: 1; background: rgba(255,255,255,0.15);
  border: 1.5px solid rgba(255,255,255,0.35);
  border-radius: 999px; padding: 0.75rem 1.2rem;
  font-family: 'DM Sans', sans-serif; font-size: 1rem; /* 16px min — prevents iOS auto-zoom */
  color: #fff; outline: none; transition: all 0.2s;
  -webkit-appearance: none;
}
.cta-input::placeholder { color: rgba(255,255,255,0.5); }
.cta-input:focus { border-color: rgba(255,255,255,0.7); }
.btn-white {
  background: #fff; color: var(--green);
  border: none; padding: 0.75rem 1.4rem;
  border-radius: 999px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.875rem; font-weight: 500;
  cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; min-height: 44px;
  transition: all 0.2s;
}
.btn-white:hover { background: #F1FBF1; }
.cta-note { font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-top: 0.75rem; }

/* ── FOOTER ── */
footer {
  border-top: 1px solid var(--border);
  padding: 2.5rem 2.5rem;
  display: flex; align-items: center; justify-content: space-between;
  max-width: 1100px; margin: 0 auto;
}
.footer-logo {
  font-family: 'Playfair Display', serif;
  font-style: italic; font-size: 1.25rem; font-weight: 400;
  color: var(--green); letter-spacing: -0.02em;
}
.footer-links { display: flex; gap: 1.5rem; }
.footer-link { font-size: 0.8rem; color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
.footer-link:hover { color: var(--text); }
.footer-copy { font-size: 0.75rem; color: var(--text-muted); }

/* ── ANIMATIONS ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}
.reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.65s ease, transform 0.65s ease; }
.reveal.visible { opacity: 1; transform: translateY(0); }
